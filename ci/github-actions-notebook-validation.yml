# Review draft: move to .github/workflows only after every TODO is pinned.
name: Notebook validation

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - required
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

concurrency:
  group: notebook-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # TODO: replace tags with reviewed full commit hashes before activation.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gjbex/Training-sessions
          # TODO: pin the commit containing notebook-classifier >= 0.3.
          ref: feature/notebook-classifier
          path: .validation-tools/Training-sessions
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.70.2
          cache: true
      - name: Install the pinned shared planning tool
        run: >-
          pixi install --locked
          --manifest-path
          .validation-tools/Training-sessions/tools/notebook-classifier/pixi.toml
      - name: Check the target-owned validation contract
        run: pixi run --locked validation-contract
      - name: Run the selected target-owned profile
        env:
          NOTEBOOK_CLASSIFIER_ROOT: >-
            ${{ github.workspace }}/.validation-tools/Training-sessions/tools/notebook-classifier
          PROFILE: ${{ github.event_name == 'schedule' && 'smoke' || inputs.profile }}
        run: >-
          pixi run --locked validation-${PROFILE}
          --output-directory "${RUNNER_TEMP}/scientific-python-validation"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/scientific-python-validation
          if-no-files-found: error
