schema_version = 2
id = "scientific-python"
title = "Scientific Python"
content_language = "en"
summary = """
This two-part training introduces the core Python tools used in scientific computing. Participants work with multidimensional numerical data, numerical algorithms, visualization, symbolic computation, labeled data, and scientific file formats, and learn to assess numerical reliability and resource use.
"""
languages = ["Python"]

[[learning_outcomes]]
statement = "Interpret NumPy array shapes, axes, dtypes, views, and copies, and express multidimensional computations using broadcasting, reductions, reshaping, and basic linear algebra."
competencies = ["numpy.create-slice-and-reshape-arrays", "numpy.vectorized-computations", "numpy.broadcasting", "numpy.reductions", "numpy.basic-linear-algebra"]

[[learning_outcomes]]
statement = "Diagnose numerical reliability and resource risks in NumPy computations, including precision, non-finite values, comparisons, reproducible randomness, memory use, and file I/O."
competencies = []

[[learning_outcomes]]
statement = "Select and apply suitable SciPy routines and assess results using solver diagnostics, residuals, or error estimates."
competencies = ["scientific-python.select-scipy-functionality"]

[[learning_outcomes]]
statement = "Create and interpret scientific visualizations with Matplotlib."
competencies = ["matplotlib.create-basic-plots", "matplotlib.interpret-basic-plots"]

[[learning_outcomes]]
statement = "Use SymPy for symbolic computation and connect symbolic expressions to numerical calculations."
competencies = ["scientific-python.symbolic-computation"]

[[learning_outcomes]]
statement = "Represent and select labeled multidimensional data with xarray and explain when labels and metadata are preferable to bare NumPy arrays."
competencies = []

[[learning_outcomes]]
statement = "Choose a scientific data format based on fidelity, metadata, access pattern, and scale, and perform fundamental HDF5 operations with h5py."
competencies = ["scientific-python.hdf5-data"]

[[learning_outcomes]]
statement = "Integrate NumPy, SciPy, SymPy, and Matplotlib in a scientific investigation and distinguish numerical cross-checking from validation of the scientific model."
competencies = []

[source]
metadata_document = "docs/README.md"
repository_url = "https://github.com/gjbex/Scientific-Python/"
website_url = "https://gjbex.github.io/Scientific-Python/"
license = "CC-BY-4.0"

[delivery]
duration_minutes = 420
duration_kind = "fixed"
session_count = 2
target_session_duration_minutes = 210
schedule_complete = true
description = """
Seven scheduled hours delivered as two parts of 210 minutes, each including a 15-minute short break. The parts can be scheduled on separate days so participants can practise independently between them. That practice is optional and is not included in the course duration. If both parts are delivered on one day, schedule a one-hour lunch between them; lunch is not included in the seven-hour duration.
"""

[audience]
description = """
This training is for researchers and technical users who already know basic Python and want to apply it to numerical computation, scientific data, visualization, and reproducible analysis.
"""

[prerequisites]
summary = """
You will need experience programming in Python. This is not a training that starts from scratch. If you plan to do Python programming in a Linux or HPC environment, you should be familiar with that environment as well. More concretely, participants should already be comfortable with the following: * running Python code in Jupyter or from the command line; * variables, numbers, strings, booleans, and basic containers such as lists and dictionaries; * `if`/`else` statements and `for` loops; * writing and calling simple functions with arguments and a return value; * indexing and slicing sequences; * importing modules and calling functions from them; * reading short Python scripts without needing every line explained. You do not need prior experience with NumPy, SciPy, Matplotlib, SymPy, xarray, or HDF5. Those are taught in the training.
"""
competencies = ["python.run-code", "python.values-and-containers", "python.control-flow-and-comprehensions", "python.functions", "python.index-and-slice-sequences", "python.import-modules"]

[self_assessment]
introduction = """
If you can do most of the tasks below without looking up basic Python syntax, you are likely ready for this training.
"""
tasks = [
  "Write a function that returns `sin(x)` for a given input `x`.",
  "Loop over a list of numbers and compute their average.",
  "Use `if`/`else` to classify a value as negative, zero, or positive.",
  "Extract every second element from a list or array using slicing.",
  "Read a short function with nested loops and understand what it computes.",
  "Import a module such as `math` and call `math.cos`.",
  "Store a few values in a dictionary and retrieve one by key.",
  "Make a small change to an example script and run it again."
]

[requirements]
software = [
  "Laptop or desktop with internet access.",
  "A Python environment that can run JupyterLab, or access to Google Colaboratory.",
  "Optional: access to a Linux or HPC system if you want to adapt the I/O examples to that environment."
]

[level]
introductory_percent = 30
intermediate_percent = 40
advanced_percent = 30
description = """
For participants who already have basic Python programming experience, the material in this training is approximately 30% introductory, 40% intermediate, and 30% advanced. These percentages describe the level of the scientific Python topics covered in the training, not the required entry level in Python itself.
"""

